name: pages

# The documentation site (W-076): built with Hugo and the Hextra theme from docs/guide, the only part
# of the documents it carries (W-077) (`just site`, site/hugo.yaml; the same build `just docs` checks
# in the gate), and published to GitHub Pages. The repository's Pages take their site from GitHub
# Actions; this workflow builds on a change to what the site is made of and deploys from the
# `github-pages` environment.

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "site/**"
      - "CONTRIBUTING.md"
      - "install.sh"
      - "justfile"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

# Each job asks for what it needs.
permissions: {}

# One deployment at a time; one already running finishes rather than leave the site half-deployed.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'zima-oss/jackstay'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Go from go.mod's toolchain line (Hugo is built from its module at the version the justfile pins)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: The site's address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: just site (the build, and its links checked at the address it is published at)
        env:
          HUGO_BASEURL: ${{ steps.pages.outputs.base_url }}/
        run: just site
      - name: Hand the site to Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
